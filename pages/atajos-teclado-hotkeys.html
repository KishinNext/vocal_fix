<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>VocalFix - Atajos de teclado</title>
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body class="h-screen bg-vf-bg text-vf-ink font-sans antialiased select-none flex flex-col overflow-hidden" data-page="shortcuts">
<!-- Window header: the left column is kept free for the macOS window buttons -->
<header class="h-11 shrink-0 grid grid-cols-[120px_1fr_120px] items-center px-4 border-b border-vf-line bg-vf-chrome" style="-webkit-app-region: drag;">
<div></div>
<span class="text-center text-[12.5px] text-vf-dim">Configuración</span>
<div></div>
</header>
<div class="flex-1 min-h-0 flex">
<!-- Sidebar: sections rendered by src/settings/shared.ts (renderSettingsNav) -->
<aside class="w-[232px] shrink-0 bg-vf-rail border-r border-vf-line px-2.5 py-5 flex flex-col gap-0.5">
<button type="button" data-path="editor" class="text-left px-3 py-2 mb-3 text-[13px] text-vf-dim rounded-md cursor-pointer transition-colors hover:text-vf-ink">← Volver al editor</button>
<nav id="settings-nav" class="flex flex-col gap-0.5" data-active="atajos-teclado-hotkeys"></nav>
<div id="settings-about" class="mt-auto px-3 pt-4 flex flex-col gap-1.5 text-xs text-vf-low"></div>
</aside>
<main class="flex-1 min-w-0 overflow-auto px-10 pt-10 pb-20">
<div class="max-w-[820px] mx-auto flex flex-col gap-7">
<header class="flex items-start justify-between gap-4">
<div class="flex flex-col gap-1.5">
<h1 class="text-[26px] font-semibold tracking-[-.01em] leading-tight">Atajos de teclado</h1>
<p class="text-[13px] text-vf-dim">Los atajos globales funcionan aunque VocalFix esté en segundo plano.</p>
</div>
<p id="settings-status" role="status" class="hidden shrink-0 pt-2 text-xs text-right"></p>
</header>

<div class="vf-list">
<div class="grid grid-cols-[minmax(0,1fr)_110px_minmax(0,1.3fr)] gap-4 px-4 py-2.5 bg-vf-chrome vf-label">
<span>Acción</span><span>En el editor</span><span>Global</span>
</div>
<div class="grid grid-cols-[minmax(0,1fr)_110px_minmax(0,1.3fr)] gap-4 items-center px-4 py-3.5 bg-vf-rail">
<span class="text-[13.5px]">Iniciar / detener grabación</span>
<span><kbd class="vf-kbd text-[11.5px] text-vf-soft">Espacio</kbd></span>
<div id="record-shortcut" class="flex items-center gap-2.5 flex-wrap min-h-[26px]"></div>
</div>
</div>
<p class="text-[12.5px] text-vf-faint">Usa al menos un modificador (<span id="modifier-hint">⌘ ⌥ ⌃ ⇧</span>) junto a una letra, número o tecla especial. Esc cancela.</p>
</div>
</main>
</div>
<script type="module" src="/src/settings.ts"></script>
</body></html>
