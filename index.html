<!DOCTYPE html><html class="h-full" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>VocalFix — Asistente de Voz y Expresión Natural</title>
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body class="h-full bg-vf-bg text-vf-ink font-sans antialiased select-none flex flex-col overflow-hidden">
<!-- Window header: the left column is kept free for the macOS window buttons -->
<header class="h-11 shrink-0 grid grid-cols-[minmax(120px,1fr)_auto_minmax(120px,1fr)] items-center gap-3 px-4 border-b border-vf-line bg-vf-chrome" style="-webkit-app-region: drag;">
<div></div>
<div class="flex justify-center">
<button id="models-pill" type="button" data-path="modelos-locales" style="-webkit-app-region: no-drag;" title="Cambiar modelos" class="flex items-center gap-2.5 bg-vf-field border border-vf-rim rounded-[7px] px-3 py-[5px] text-[12.5px] text-vf-soft cursor-pointer transition-colors hover:bg-vf-raised hover:text-vf-ink">
<span id="stt-dot" class="w-1.5 h-1.5 rounded-full bg-vf-faint"></span><span id="stt-model-label">…</span><span class="text-[#4a4a50] mx-0.5">·</span><span id="llm-dot" class="w-1.5 h-1.5 rounded-full bg-vf-faint"></span><span id="llm-model-label">…</span><span class="text-vf-faint text-[10px]">▾</span>
</button>
</div>
<div class="flex items-center justify-end gap-1">
<button id="update-notice" type="button" style="-webkit-app-region: no-drag;" class="hidden text-[12.5px] text-vf-amber px-2 py-1 rounded-md cursor-pointer transition-colors hover:bg-vf-raised disabled:cursor-default disabled:hover:bg-transparent"></button>
<button id="btn-settings" data-path="ajustes" style="-webkit-app-region: no-drag;" type="button" class="text-[12.5px] text-vf-mute px-2 py-1 rounded-md cursor-pointer transition-colors hover:bg-vf-raised hover:text-vf-ink">Ajustes</button>
</div>
</header>

<!-- Three panels: what was said, its correction, the natural suggestion -->
<main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-3 lg:grid-rows-[minmax(0,1fr)] gap-3 p-4 overflow-auto">
<section class="bg-vf-panel border border-vf-edge rounded-[10px] flex flex-col min-h-[280px] min-w-0">
<div class="h-12 shrink-0 flex items-center gap-2 px-5 border-b border-vf-line text-[11.5px] font-medium tracking-[.06em] text-vf-mute">TRANSCRIPCIÓN</div>
<div id="live-transcription" class="flex-1 min-h-0 overflow-auto px-5 py-4 text-base leading-7 text-vf-soft select-text">
<p class="text-sm leading-relaxed text-vf-faint select-none">Pulsa <kbd class="vf-kbd">Espacio</kbd> o el botón Grabar para empezar a dictar.</p>
</div>
</section>

<section class="bg-vf-panel border border-vf-edge rounded-[10px] flex flex-col min-h-[280px] min-w-0">
<div class="h-12 shrink-0 flex items-center gap-2 px-5 border-b border-vf-line text-[11.5px] font-medium tracking-[.06em] text-vf-mute">CORRECCIÓN</div>
<div id="grammar-review-container" class="flex-1 min-h-0 overflow-auto px-5 py-4 text-base leading-7 text-vf-ink select-text">
<p class="text-sm text-vf-ghost select-none">Los errores corregidos aparecerán resaltados.</p>
</div>
</section>

<section class="bg-vf-panel border border-vf-edge rounded-[10px] flex flex-col min-h-[280px] min-w-0">
<div class="h-12 shrink-0 flex items-center justify-between gap-2 pl-5 pr-3 border-b border-vf-line">
<div class="flex items-center gap-2 text-[11.5px] font-medium tracking-[.06em] text-vf-mute">SUGERENCIA</div>
<select id="tone-select" title="Tono de la sugerencia" class="vf-select"></select>
</div>
<div id="primary-recommendation" class="flex-1 min-h-0 overflow-auto px-5 py-4 text-base leading-7 text-vf-bright select-text">
<p class="text-sm text-vf-ghost select-none">La versión natural aparecerá aquí.</p>
</div>
<div class="h-[52px] shrink-0 flex items-center justify-end gap-2 px-3 border-t border-vf-line">
<button id="speakBtn" type="button" disabled title="Escuchar la sugerencia" class="text-vf-soft border border-vf-stroke rounded-md px-3 py-1.5 text-[12.5px] cursor-pointer transition-colors hover:bg-vf-raised disabled:opacity-40 disabled:pointer-events-none"><span id="speakBtnText">Escuchar</span></button>
<button id="copyBtn" type="button" class="bg-[#ecebe8] text-vf-chrome rounded-md px-3.5 py-1.5 text-[12.5px] font-medium cursor-pointer transition-colors hover:bg-white"><span id="copyBtnText">Copiar</span></button>
</div>
</section>
</main>

<!-- Control dock -->
<footer class="h-16 shrink-0 grid grid-cols-[1fr_auto_1fr] items-center gap-4 px-4 border-t border-vf-line bg-vf-chrome">
<div class="flex items-center min-w-0">
<select id="mic-select" title="Micrófono" class="vf-select py-1.5 text-[12.5px] max-w-[220px] min-w-0">
<option value="">Predeterminado</option>
</select>
<div id="mic-level" title="Nivel del micrófono" class="flex items-center gap-[3px] h-5 ml-3 shrink-0"></div>
</div>
<button id="recordToggleBtn" type="button" data-state="idle"></button>
<div class="flex items-center justify-end">
<button id="clearBtn" type="button" title="Limpiar los tres paneles" class="vf-btn-text text-[12.5px] text-vf-dim">Limpiar</button>
</div>
</footer>
<script type="module" src="/src/main.ts"></script>
</body></html>
