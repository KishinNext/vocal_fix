# Builds the installers: VocalFix-<version>.dmg on macOS and VocalFix Setup <version>.exe on Windows.
# - Run it by hand from the Actions tab: the installers are attached to the run as artifacts.
# - Push a tag like v0.1.0: the installers are also published as a GitHub Release.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the whisper.cpp server
        run: npm run whisper:build

      - run: npm test

      - name: Build the installer
        run: npm run dist
        env:
          # No signing certificate: macOS gets an ad-hoc signature, Windows is unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: VocalFix-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
